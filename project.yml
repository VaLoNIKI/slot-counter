name: SlotCounter

options:
  bundleIdPrefix: com.valoniki
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ja
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic

targets:
  SlotCounter:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: SlotCounter
        PRODUCT_BUNDLE_IDENTIFIER: com.valoniki.slotcounter
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - target: SlotCounterWidget
        embed: true
    scheme: {}

  SlotCounterWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: SlotCounterWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.valoniki.slotcounter.widget
        INFOPLIST_FILE: Widget/Info.plist
        SKIP_INSTALL: YES
